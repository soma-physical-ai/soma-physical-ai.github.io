<!-- A placeholder to allow defining custom metadata -->

<!-- 커스텀: 글 상단 작성자(byline) 링크를 새 탭으로 열기 -->
<script>
  (function () {
    function authorsNewTab() {
      document.querySelectorAll('.post-meta em a[href]').forEach(function (a) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', authorsNewTab);
    } else {
      authorsNewTab();
    }
  })();
</script>
